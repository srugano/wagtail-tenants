[pytest]
DJANGO_SETTINGS_MODULE = tests.settings
norecursedirs = docs .tox _plugin_template .idea  node_modules ~*
django_find_project = false
log_format = %(asctime)s %(levelname)s %(message)s
log_cli = false
log_date_format = %Y-%m-%d %H:%M:%S
pythonpath = wagtail_tenants
testpaths = tests
tmp_path_retention_policy = all
tmp_path_retention_count = 0
addopts = -rs --reuse-db -n auto --tb=short --capture=sys --echo-version django --cov=wagtail_tenants


markers =
    api:
    admin:
    skip_models:
    skip_buttons:
    select_buttons:
    smoke:
    needs_prod_environment:

python_files =test_*.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::django.utils.deprecation.RemovedInDjango60Warning
    ignore::coverage.exceptions.CoverageWarning
