[tool.poetry]
name = "wagtail_tenants"
version = "0.3.0"
description = "Adds multitenancy based on django_tenants to wagtail cms"
authors = ["Boris Brue <boris@zuckersalzundpfeffer.de>"]
license = "MIT"
readme = "README.md"
homepage = "https://wagtail-tenants.readthedocs.io/en/latest/"
repository = "https://github.com/borisbrue/wagtail-tenants"

[tool.poetry.dependencies]
python = "^3.12"
django-tenants = "^3.9.0"
django-dbbackup = "^4.3.0"
wagtail = "^6.0.0"
Django = "~5.1.15"
PyYAML = "^6.0.1"
djlint = "^1.36.4"

[tool.poetry.group.dev.dependencies]
black = "^24.3.0"
flake8 = "^7.1.0"
Sphinx = "^7.3.7"
isort = "^5.13.2"
pytest-django = "^4.8.0"
tox = "^4.15.0"
pytest-xdist = "^3.5.0"
factory-boy = "^3.3.1"
pytest = "^8.2.1"
coverage = "^7.5.3"

psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"
myst-parser = "^2.0.0"
sphinx-rtd-theme = "^2.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
docs = ["sphinx"]
